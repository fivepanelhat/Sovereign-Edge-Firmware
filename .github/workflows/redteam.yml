name: Red Team Scan
on:
  schedule:
    - cron: "0 4 * * 1"  # weekly Monday 04:00 UTC
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    types: [ opened, synchronize, reopened ]
concurrency:
  group: redteam-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  redteam:
    name: Red Team Bandit + Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: pip install bandit safety

      - name: Bandit SAST
        run: bandit -r . -ll --exclude ./tests_security_stress/

      - name: Safety check
        run: safety check --full-report || true

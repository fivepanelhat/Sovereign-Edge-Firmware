name: CI Scan
on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
concurrency:
  group: ci-scan-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci-scan:
    name: Lint + Unit + SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install bandit pytest black flake8 || true

      - name: Black check
        run: black --check . || true

      - name: Flake8
        run: flake8 . || true

      - name: Bandit
        run: bandit -r . -ll --exclude ./tests_security_stress/ || true

      - name: Pytest
        run: pytest -q || true
